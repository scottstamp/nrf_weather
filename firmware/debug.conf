# Debug overlay: west build ... -- -DEXTRA_CONF_FILE=debug.conf
# USB CDC ACM console + logging. Draws several mA while USB is attached;
# do not use for battery life measurements.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
# Shorter cycle for bench testing
CONFIG_WX_POLL_INTERVAL_S=60
CONFIG_WX_RETRY_INTERVAL_S=60
CONFIG_WX_STALE_AFTER_S=1200
