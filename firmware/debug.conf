# Debug overlay: west build ... -- -DEXTRA_CONF_FILE=debug.conf
# USB CDC ACM console + logging. Draws several mA while USB is attached;
# do not use for battery life measurements.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_RESET_ON_FATAL_ERROR=n
# Dev console: poll / reset / boot commands, 1200-baud touch -> bootloader
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_WX_DEVCMD=y
# Poll cadence uses the production defaults (30 min / 5 min retry / 3 h stale).
# Trigger an immediate poll with `scripts/devcmd.sh poll` or the poll button.
