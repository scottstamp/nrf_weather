# ---- Production (battery) configuration. Debug extras live in debug.conf ----

# USB CDC ACM console + logging, powered only while a cable is attached.
# The board helper registers the CDC ACM UART, but must NOT enable USB at boot:
# udc_nrf_enable() requests the HFXO (~250+ uA continuous) regardless of VBUS.
# src/devcmd.c enables USB on VBUS_READY and disables it on VBUS_REMOVED.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
# Dev console: poll / reset / boot, 1200-baud touch -> UF2 bootloader
CONFIG_WX_DEVCMD=y

# Peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_CRC=y
CONFIG_HWINFO=y

# Power management: SPIM suspends between transfers (pins disconnected)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Bluetooth peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="WxPaper"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_SMP=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_DIS=n

# Throughput: 247-byte MTU, 251-byte data length, 2M PHY
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=8
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Note: CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=0 (request the fast interval at
# once) was tried in bring-up: BlueZ then forced its 48.75 ms default anyway.
# Kept at the spec default (5 s); see docs/bringup-log.md.

# Stacks
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Robustness
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_ASSERT=n
CONFIG_REBOOT=y
