# wxd configuration. Copy to ~/.config/wxd/config.toml or /etc/wxd/config.toml.

# Cache directory for the last good weather model (default: $XDG_CACHE_HOME/wxd).
# cache_dir = "/var/lib/wxd"

[location]
# Passed through to weather.WeatherConfig (unknown keys are ignored).
# A1K 1E1 = Torbay, NL. ECCC has no Torbay citypage; the nearest is nl-24
# (St. John's, obs at CYYT airport). lat/lon are used by the Open-Meteo fallback.
lat = 47.65
lon = -52.73
name = "St. John's"

[weather]
refresh_s = 600        # background refresh period (>= 30)

[render]
rotate = 90            # 90 or 270, depending on which side the panel connector is on
red_invert = false     # keep false: fix panel red polarity in firmware (CONFIG_WX_EPD_RED_INVERT)
                       # so the device's own OFFLINE/LOW BATTERY overlays match

[ble]
# device_address = "AA:BB:CC:DD:EE:FF"   # optional: pin one device (default: match name/service UUID)
adapter = "hci0"
poll_interval_s = 1800                    # sent via SET_INTERVAL if device differs (300..86400)
